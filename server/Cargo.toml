[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
default = []
tui = ["dep:ratatui", "dep:reqwest"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "json"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
rsa = "0.9"
rand = "0.8"
qrcode = "0.14"
dirs = "6"
libc = "0.2"
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json"], optional = true }

[[bin]]
name = "dzap-tui"
path = "src/bin/dzap-tui.rs"
required-features = ["tui"]

[profile.release]
opt-level = 2
strip = true

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.4", features = ["json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
